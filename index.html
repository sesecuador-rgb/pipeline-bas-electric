<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Pipeline Comercial BAS Electric</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101E28">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pipeline BAS">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#101E28;
  --navy-2:#16303F;
  --steel:#1D4E63;
  --steel-light:#2E6B85;
  --brass:#C9A227;
  --brass-light:#E0BE4E;
  --bg:#EEF2F1;
  --card:#FFFFFF;
  --ink:#1C2B33;
  --muted:#65787F;
  --border:#DCE3E2;
  --green:#2E7D5B;
  --green-bg:#E7F3ED;
  --amber:#B9790A;
  --amber-bg:#FBF1DD;
  --red:#B33A2E;
  --red-bg:#FBEAE7;
  --lcd-bg:#0C201B;
  --lcd-fg:#43E795;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--ink);
  height:100vh;
  overflow:hidden;
  font-size:14px;
}
.display{font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:13px;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:#C7D0CF; border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

#app{display:flex; height:100vh; width:100vw;}

/* ===== SIDEBAR ===== */
#sidebar{
  width:78px; background:var(--navy); flex-shrink:0;
  display:flex; flex-direction:column; align-items:center;
  padding:16px 0; gap:4px;
}
.brand-mark{
  width:46px; height:46px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  margin-bottom:22px; box-shadow:0 2px 8px rgba(0,0,0,.35);
  overflow:hidden;
}
.brand-mark svg{width:24px; height:24px;}
.navbtn{
  width:56px; padding:9px 0 7px; border:none; background:transparent; color:#8FA3AC;
  display:flex; flex-direction:column; align-items:center; gap:5px;
  border-radius:10px; transition:.15s;
}
.navbtn svg{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.7;}
.navbtn span{font-size:10.5px; font-weight:600; letter-spacing:.02em;}
.navbtn:hover{background:rgba(255,255,255,.06); color:#DCE7EA;}
.navbtn.active{background:var(--steel); color:#fff;}
.navbtn .badge{
  position:absolute; margin-top:-30px; margin-left:22px;
  background:var(--brass); color:#1C2B33; font-size:9px; font-weight:700;
  border-radius:20px; min-width:15px; height:15px; display:flex; align-items:center; justify-content:center; padding:0 3px;
}
#sidebar-bottom{margin-top:auto; display:flex; flex-direction:column; align-items:center; gap:2px;}
.company-tag{color:#526870; font-size:9.5px; text-align:center; line-height:1.3; padding:10px 4px;}

/* ===== MAIN ===== */
#main{flex:1; display:flex; flex-direction:column; min-width:0;}
#topbar{
  height:60px; background:var(--card); border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 22px; gap:16px; flex-shrink:0;
}
#topbar h1{font-family:'Barlow Condensed'; font-weight:700; font-size:21px; letter-spacing:.01em;}
#topbar .sub{color:var(--muted); font-size:12px; margin-top:1px;}
#topbar-search{
  margin-left:auto; width:280px; padding:8px 12px; border:1px solid var(--border);
  border-radius:8px; background:var(--bg); font-size:13px; outline:none;
}
#topbar-search:focus{border-color:var(--steel-light); background:#fff;}
.btn{
  padding:9px 15px; border-radius:8px; border:1px solid var(--border); background:#fff;
  font-size:13px; font-weight:600; color:var(--ink); display:flex; align-items:center; gap:6px;
  white-space:nowrap;
}
.btn:hover{border-color:var(--steel-light);}
.btn-primary{background:var(--steel); color:#fff; border-color:var(--steel);}
.btn-primary:hover{background:var(--steel-light);}
.btn-brass{background:var(--brass); color:#20220a; border-color:var(--brass);}
.btn-ghost{border-color:transparent; background:transparent;}
.btn-ghost:hover{background:var(--bg);}
.btn-sm{padding:6px 10px; font-size:12px;}
.btn-danger{color:var(--red);}
.btn svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2;}

#view{flex:1; overflow-y:auto; padding:20px 26px 40px;}

/* ===== GRID / CARDS ===== */
.grid{display:grid; gap:14px;}
.g-4{grid-template-columns:repeat(4,1fr);}
.g-3{grid-template-columns:repeat(3,1fr);}
.g-2{grid-template-columns:repeat(2,1fr);}
.card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px;}
.card-title{font-family:'Barlow Condensed'; font-weight:700; font-size:15px; letter-spacing:.02em; text-transform:uppercase; color:var(--steel); margin-bottom:10px; display:flex; align-items:center; justify-content:space-between;}

/* KPI indicator (LCD look) */
.kpi{
  background:var(--lcd-bg); border-radius:12px; padding:14px 16px; position:relative; overflow:hidden;
  border:1px solid #0a1a15;
}
.kpi::before{content:""; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--brass),var(--green));}
.kpi .label{color:#7FA895; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px;}
.kpi .value{font-family:'IBM Plex Mono'; font-weight:600; font-size:28px; color:var(--lcd-fg); line-height:1;}
.kpi .value small{font-size:14px; color:#6FDBA1;}
.kpi .foot{color:#5C8574; font-size:11px; margin-top:5px;}

.section-label{font-family:'Barlow Condensed'; font-size:12.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:22px 0 10px;}
.section-label:first-child{margin-top:0;}

/* Task list (today) */
.task-row{
  display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:9px; background:var(--bg);
  margin-bottom:7px; border:1px solid transparent;
}
.task-row:hover{border-color:var(--border);}
.task-check{
  width:20px; height:20px; border-radius:6px; border:2px solid #C4CFCE; flex-shrink:0; background:#fff;
  display:flex; align-items:center; justify-content:center;
}
.task-check svg{width:12px; height:12px; display:none; stroke:#fff; fill:none; stroke-width:3;}
.task-row.overdue .task-check{border-color:var(--red);}
.tag{
  font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px; text-transform:uppercase; letter-spacing:.04em;
}
.tag-llamada{background:#E4EEF6; color:#1E5A85;}
.tag-whatsapp{background:#E1F4E9; color:#1F7A45;}
.tag-correo{background:#F1E9F8; color:#6B3FA0;}
.tag-visita{background:var(--amber-bg); color:var(--amber);}
.tag-cotizacion{background:#FDECE4; color:#B4531D;}
.tag-seguimiento{background:#EEF0F5; color:#454F63;}
.tag-oc{background:var(--green-bg); color:var(--green);}

.pill{padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700;}
.pill-a{background:var(--red-bg); color:var(--red);}
.pill-b{background:var(--amber-bg); color:var(--amber);}
.pill-c{background:#EEF0F5; color:var(--muted);}
.pill-cliente{background:var(--green-bg); color:var(--green);}
.pill-inactivo{background:#EEF0F5; color:var(--muted);}

/* funnel */
.funnel{display:flex; align-items:stretch; gap:2px; margin-top:6px;}
.funnel-step{flex:1; text-align:center; padding:12px 6px; position:relative;}
.funnel-step .n{font-family:'IBM Plex Mono'; font-weight:600; font-size:22px; color:var(--steel);}
.funnel-step .l{font-size:10.5px; color:var(--muted); margin-top:2px; text-transform:uppercase; letter-spacing:.04em;}
.funnel-step:not(:last-child)::after{
  content:"→"; position:absolute; right:-3px; top:14px; color:#C4CFCE; font-size:15px;
}

.goal-row{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
.goal-label{width:110px; font-size:12.5px; font-weight:600; flex-shrink:0;}
.goal-bar{flex:1; height:9px; background:#E8ECEB; border-radius:20px; overflow:hidden;}
.goal-bar-fill{height:100%; border-radius:20px;}
.goal-num{width:96px; text-align:right; font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--muted); flex-shrink:0;}
.dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-left:6px;}

.alert-row{display:flex; gap:10px; align-items:flex-start; padding:9px 11px; border-radius:8px; margin-bottom:6px; font-size:12.5px;}
.alert-row.warn{background:var(--amber-bg); color:#8A5C06;}
.alert-row.danger{background:var(--red-bg); color:#8A2A20;}
.alert-row.info{background:#E9F1F8; color:#1E5A85;}

/* Empresas list */
.table{width:100%; border-collapse:collapse;}
.table th{
  text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
  padding:8px 12px; border-bottom:1px solid var(--border); font-weight:700;
}
.table td{padding:11px 12px; border-bottom:1px solid #EEF1F0; font-size:13px; vertical-align:middle;}
.table tr.clickable:hover{background:var(--bg); cursor:pointer;}
.avatar-sq{
  width:32px; height:32px; border-radius:7px; background:var(--steel); color:#fff; display:flex; align-items:center;
  justify-content:center; font-family:'Barlow Condensed'; font-weight:700; font-size:13px; flex-shrink:0;
}
.company-cell{display:flex; align-items:center; gap:10px;}
.company-name{font-weight:600;}
.company-sub{font-size:11.5px; color:var(--muted);}

.filters{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
.chip{
  padding:6px 13px; border-radius:20px; border:1px solid var(--border); background:#fff; font-size:12.5px; font-weight:600;
  color:var(--muted);
}
.chip.active{background:var(--steel); color:#fff; border-color:var(--steel);}

/* Kanban */
#kanban{display:flex; gap:12px; overflow-x:auto; padding-bottom:14px; height:100%;}
.kcol{min-width:230px; max-width:230px; flex-shrink:0; display:flex; flex-direction:column;}
.kcol-head{padding:8px 4px 10px; display:flex; align-items:center; justify-content:space-between;}
.kcol-head .t{font-family:'Barlow Condensed'; font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:.02em; color:var(--ink);}
.kcol-head .n{font-family:'IBM Plex Mono'; font-size:11px; color:var(--muted); background:var(--bg); padding:2px 7px; border-radius:20px;}
.kcol-body{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:2px;}
.kcard{
  background:#fff; border:1px solid var(--border); border-left:4px solid var(--steel); border-radius:8px; padding:10px 11px; font-size:12.5px;
}
.kcard .name{font-weight:700; margin-bottom:3px;}
.kcard .val{font-family:'IBM Plex Mono'; color:var(--brass); font-weight:600; font-size:12px; margin-top:5px;}
.kcard .meta{color:var(--muted); font-size:11px; margin-top:4px;}
.kcard.overdue{border-left-color:var(--red); background:var(--red-bg);}

/* Detail / drawer */
#drawer-backdrop{position:fixed; inset:0; background:rgba(16,30,40,.42); display:none; z-index:40;}
#drawer{
  position:fixed; top:0; right:0; bottom:0; width:640px; background:var(--bg); box-shadow:-6px 0 24px rgba(0,0,0,.15);
  transform:translateX(100%); transition:transform .22s ease; z-index:41; display:flex; flex-direction:column;
}
#drawer.open{transform:translateX(0);}
#drawer-backdrop.open{display:block;}
.drawer-head{background:var(--navy); color:#fff; padding:20px 22px; flex-shrink:0;}
.drawer-head .top{display:flex; justify-content:space-between; align-items:flex-start;}
.drawer-head h2{font-family:'Barlow Condensed'; font-size:24px; font-weight:700;}
.drawer-head .meta{color:#9FB4BC; font-size:12.5px; margin-top:3px;}
.drawer-close{background:rgba(255,255,255,.1); border:none; color:#fff; width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center;}
.drawer-tabs{display:flex; gap:2px; padding:0 22px; margin-top:16px;}
.dtab{padding:8px 3px; margin-right:18px; color:#9FB4BC; font-size:12.5px; font-weight:600; border-bottom:2px solid transparent; background:none; border-top:none; border-left:none; border-right:none;}
.dtab.active{color:#fff; border-bottom-color:var(--brass);}
.drawer-body{flex:1; overflow-y:auto; padding:18px 22px 60px;}

.field{margin-bottom:12px;}
.field label{display:block; font-size:11.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-bottom:4px;}
.field input, .field select, .field textarea{
  width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px; background:#fff; outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--steel-light);}
.field textarea{resize:vertical; min-height:60px;}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}

.mini-list-item{
  display:flex; align-items:center; justify-content:space-between; background:#fff; border:1px solid var(--border);
  border-radius:9px; padding:10px 12px; margin-bottom:8px;
}
.mini-list-item .name{font-weight:600; font-size:13px;}
.mini-list-item .sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
.icon-btn{background:none; border:none; color:var(--muted); padding:5px; border-radius:6px; display:flex;}
.icon-btn:hover{background:var(--bg); color:var(--ink);}
.icon-btn svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2;}

.timeline{position:relative; padding-left:20px;}
.timeline::before{content:""; position:absolute; left:5px; top:4px; bottom:4px; width:2px; background:var(--border);}
.tl-item{position:relative; padding-bottom:16px;}
.tl-item::before{content:""; position:absolute; left:-19px; top:3px; width:10px; height:10px; border-radius:50%; background:var(--steel); border:2px solid #fff;}
.tl-date{font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--muted);}
.tl-text{font-size:13px; margin-top:2px;}

/* Modal */
#modal-backdrop{position:fixed; inset:0; background:rgba(16,30,40,.5); display:none; align-items:center; justify-content:center; z-index:50;}
#modal-backdrop.open{display:flex;}
#modal{background:#fff; border-radius:14px; width:540px; max-height:88vh; display:flex; flex-direction:column; overflow:hidden;}
.modal-head{padding:18px 22px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;}
.modal-head h3{font-family:'Barlow Condensed'; font-size:19px; font-weight:700;}
.modal-body{padding:18px 22px; overflow-y:auto;}
.modal-foot{padding:16px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px;}

.empty-state{text-align:center; padding:36px 10px; color:var(--muted);}
.empty-state svg{width:34px; height:34px; stroke:#C4CFCE; margin-bottom:10px;}

/* Quotation doc */
.quote-doc{background:#fff; border:1px solid var(--border); border-radius:12px; overflow:hidden;}
.quote-head{background:var(--navy); color:#fff; padding:22px 26px; display:flex; justify-content:space-between; align-items:flex-start;}
.quote-brand{display:flex; align-items:center; gap:12px;}
.quote-brand .mark{width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; overflow:hidden;}
.quote-brand .mark svg{width:26px; height:26px;}
.quote-brand .txt div:first-child{font-family:'Barlow Condensed'; font-weight:700; font-size:19px; letter-spacing:.02em;}
.quote-brand .txt div:last-child{font-size:11px; color:#9FB4BC;}
.quote-num{text-align:right;}
.quote-num .n{font-family:'IBM Plex Mono'; font-size:20px; color:var(--brass-light); font-weight:600;}
.quote-num .d{font-size:11px; color:#9FB4BC; margin-top:2px;}
.quote-body{padding:24px 26px;}
.quote-parties{display:flex; gap:24px; margin-bottom:20px;}
.quote-parties .p{flex:1;}
.quote-parties .p .h{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; margin-bottom:5px;}
.quote-parties .p .l{font-size:13px; margin-bottom:2px;}
.quote-table{width:100%; border-collapse:collapse; margin-top:6px;}
.quote-table th{background:var(--bg); text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:9px 12px; font-weight:700;}
.quote-table td{padding:11px 12px; border-bottom:1px solid #EEF1F0; font-size:13px;}
.quote-table .r{text-align:right;}
.quote-totals{margin-top:14px; margin-left:auto; width:260px;}
.quote-totals .row{display:flex; justify-content:space-between; padding:6px 0; font-size:13px;}
.quote-totals .row.total{border-top:2px solid var(--navy); margin-top:4px; padding-top:10px; font-weight:700; font-size:16px; font-family:'IBM Plex Mono';}
.quote-foot{background:var(--bg); padding:16px 26px; font-size:11.5px; color:var(--muted); display:flex; justify-content:space-between;}
.status-strip{padding:10px 26px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; display:flex; align-items:center; gap:8px;}

@media print{
  #sidebar,#topbar,.no-print{display:none !important;}
  body{overflow:visible;}
  #view{overflow:visible; padding:0;}
}
</style>
</head>
<body>
<div id="app">

function empresaFromImportRow(row, creadoEn){
  return {
    id:uid(), nombre:row.nombre, razonSocial:row.nombre, ruc:'', ciudad:row.ciudad||'', direccion:'',
    sector:row.sector||'', clasificacion:row.clasificacion||'C', estadoCliente:'prospecto',
    fuente:'Prospección BAS', web:'', maps:'', observaciones:row.observaciones||'',
    servicioRecomendado:row.servicioRecomendado||'', contactoObjetivo:row.contactoObjetivo||'',
    contactos:[], equipos:[], creadoEn
  };
}

function seedData(){
  const hoy = todayISO();
  const empresas = IMPORTED_EMPRESAS_RAW.map(row => empresaFromImportRow(row, hoy));

  return {
    empresas, oportunidades:[], cotizaciones:[], activityLog:[],
    metas:{empresas:10, contactos:20, llamadas:30, conversaciones:10, visitas:3, cotizaciones:2},
    correlativoCotizacion:100,
  };
}
function shiftISO(iso,days){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }

/* ---------- persistencia (localStorage: funciona en cualquier navegador, incluido GitHub Pages) ---------- */
const STORAGE_KEY = 'bas-crm-data-v1';
async function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ DATA = JSON.parse(raw); return; }
  }catch(e){ console.error('No se pudo leer el almacenamiento local', e); }
  DATA = seedData();
  persist();
}
function scheduleSave(){
  clearTimeout(SAVE_TIMER);
  SAVE_TIMER = setTimeout(persist, 350);
}
function persist(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }
  catch(e){ console.error('No se pudo guardar. El almacenamiento del navegador podría estar lleno.', e); }
}

function oportunidadById(id){ return DATA.oportunidades.find(o=>o.id===id); }
function cotizacionesDe(empresaId){ return DATA.cotizaciones.filter(c=>c.empresaId===empresaId); }
function logDe(empresaId){ return DATA.activityLog.filter(a=>a.empresaId===empresaId).sort((a,b)=>a.fecha<b.fecha?1:-1); }
function totalCotizacion(c){ return c.items.reduce((s,i)=>s+(i.cant*i.precio),0); }

function logActivity(empresaId, oportunidadId, tipo, detalle, fecha){
  DATA.activityLog.push({id:uid(), empresaId, oportunidadId: oportunidadId||null, tipo, detalle, fecha: fecha||todayISO()});
  scheduleSave();
}

function weekRange(){
  const now = new Date();
  const day = (now.getDay()+6)%7; // lunes=0
  const monday = new Date(now); monday.setDate(now.getDate()-day);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  return {start: monday.toISOString().slice(0,10), end: sunday.toISOString().slice(0,10)};
}
function countThisWeek(tipo){
  const {start,end} = weekRange();
  return DATA.activityLog.filter(a=>a.tipo===tipo && a.fecha>=start && a.fecha<=end).length;
}
function empresasNuevasEstaSemana(){
  const {start,end} = weekRange();
  return DATA.empresas.filter(e=>e.creadoEn>=start && e.creadoEn<=end).length;
}
function contactosNuevosEstaSemana(){
  const {start,end} = weekRange();
  let n=0;
  DATA.empresas.forEach(e=>e.contactos.forEach(c=>{ if(!c.creadoEn) return; if(c.creadoEn>=start && c.creadoEn<=end) n++; }));
  return n;
}
function conversacionesEstaSemana(){
  const {start,end} = weekRange();
  return DATA.activityLog.filter(a=>['llamada','whatsapp'].includes(a.tipo) && a.detalle && a.fecha>=start && a.fecha<=end).length;
}
function visitasRealizadasEstaSemana(){
  const {start,end} = weekRange();
  return DATA.activityLog.filter(a=>a.tipo==='visita' && a.fecha>=start && a.fecha<=end).length;
}
function ventasGanadasEstaSemana(){
  const {start,end} = weekRange();
  return DATA.oportunidades.filter(o=>o.estado===10 && o.fechaCierre && o.fechaCierre>=start && o.fechaCierre<=end).length;
}

function pipelineOpen(){ return DATA.oportunidades.filter(o=>![10,11].includes(o.estado)); }
function conteoEmbudo(){
  const totalEmpresas = DATA.empresas.length;
  const contactadas = new Set(DATA.activityLog.filter(a=>['llamada','whatsapp','correo'].includes(a.tipo)).map(a=>a.empresaId)).size;
  const conversaciones = DATA.oportunidades.filter(o=>o.estado>=3).length;
  const visitas = DATA.oportunidades.filter(o=>o.estado>=6).length;
  const cotizaciones = DATA.oportunidades.filter(o=>o.estado>=8).length;
  const ventas = DATA.oportunidades.filter(o=>o.estado===10).length;
  return {totalEmpresas, contactadas, conversaciones, visitas, cotizaciones, ventas};
}

function tareasHoy(){
  const hoy = todayISO();
  return pipelineOpen().filter(o=>o.proximaFecha && o.proximaFecha<=hoy)
    .sort((a,b)=> a.proximaFecha<b.proximaFecha?-1:1);
}
function alertas(){
  const out = [];
  pipelineOpen().forEach(o=>{
    const log = DATA.activityLog.filter(a=>a.oportunidadId===o.id).sort((a,b)=>a.fecha<b.fecha?1:-1);
    const last = log[0];
    const ref = last ? last.fecha : o.creadoEn;
    const d = daysBetween(ref);
    if(d>=7){ out.push({tipo:'danger', text:`${empresaById(o.empresaId)?.nombre||'—'} — ${d} días sin contacto.`}); }
  });
  DATA.cotizaciones.filter(c=>c.estado==='Enviada'||c.estado==='En seguimiento').forEach(c=>{
    const d = daysBetween(c.fechaEnvio||c.fecha);
    if(d>=5){ out.push({tipo:'warn', text:`Cotización ${c.numero} enviada hace ${d} días sin seguimiento.`}); }
  });
  DATA.empresas.forEach(e=>{
    (e.equipos||[]).forEach(eq=>{
      if(eq.proximoMantenimiento){
        const d = -daysBetween(eq.proximoMantenimiento);
        if(d>=0 && d<=30){ out.push({tipo:'info', text:`${e.nombre}: mantenimiento de ${eq.tipo} en ${d} día(s).`}); }
      }
      if(eq.proximaCalibracion){
        const d = -daysBetween(eq.proximaCalibracion);
        if(d>=0 && d<=30){ out.push({tipo:'info', text:`${e.nombre}: calibración de ${eq.tipo} vence en ${d} día(s).`}); }
      }
    });
  });
  return out;
}
function sugerirProximaAccion(estado){
  const map = {1:'Llamada de primer contacto', 2:'Segunda llamada o WhatsApp', 3:'Identificar necesidad / problema técnico',
    4:'Proponer visita técnica', 5:'Confirmar visita', 6:'Preparar cotización', 7:'Enviar cotización',
    8:'Llamar para dar seguimiento a la cotización', 9:'Negociar alcance / precio / OC', 12:'Seguimiento mensual'};
  return map[estado] || 'Definir próxima acción';
}

function render(){
  document.querySelectorAll('.navbtn[data-view]').forEach(b=>b.classList.toggle('active', b.dataset.view===VIEW));
  const view = document.getElementById('view');
  const titleEl = document.getElementById('topbar-title');
  const subEl = document.getElementById('topbar-sub');
  const now = new Date();
  const fecha = now.toLocaleDateString('es-EC',{weekday:'long', day:'numeric', month:'long'});

  if(VIEW==='dashboard'){
    titleEl.textContent = '¿Qué tengo que hacer hoy?';
    subEl.textContent = fecha.charAt(0).toUpperCase()+fecha.slice(1);
    view.innerHTML = renderDashboard();
    bindDashboard();
  } else if(VIEW==='empresas'){
    titleEl.textContent = 'Empresas';
    subEl.textContent = `${DATA.empresas.length} registradas`;
    view.innerHTML = renderEmpresas();
    bindEmpresas();
  } else if(VIEW==='pipeline'){
    titleEl.textContent = 'Pipeline comercial';
    subEl.textContent = `${pipelineOpen().length} oportunidades abiertas`;
    view.innerHTML = renderPipeline();
    bindPipeline();
  } else if(VIEW==='cotizaciones'){
    titleEl.textContent = 'Cotizaciones';
    subEl.textContent = `${DATA.cotizaciones.length} registradas`;
    view.innerHTML = renderCotizaciones();
    bindCotizaciones();
  } else if(VIEW==='reportes'){
    titleEl.textContent = 'Reporte mensual';
    subEl.textContent = now.toLocaleDateString('es-EC',{month:'long', year:'numeric'});
    view.innerHTML = renderReportes();
  } else if(VIEW==='config'){
    titleEl.textContent = 'Metas semanales';
    subEl.textContent = 'Ajusta tus objetivos de prospección';
    view.innerHTML = renderConfig();
    bindConfig();
  }
}

let DRAWER_TAB = 'general';
let DRAWER_EMPRESA = null;

function openEmpresaDrawer(empresaId, tab){
  DRAWER_EMPRESA = empresaId; DRAWER_TAB = tab || 'general';

  document.getElementById('drawer-backdrop').classList.add('open');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');

}
function renderDrawer(){
  const e = empresaById(DRAWER_EMPRESA);
  if(!e) return;
  const tabs = [['general','General'],['contactos','Contactos'],['equipos','Equipos'],['pipeline','Pipeline'],['historial','Historial']];
  document.getElementById('drawer').innerHTML = `
    <div class="drawer-head">
      <div class="top">
        <div>
          <h2>${escapeHtml(e.nombre)}</h2>
          <div class="meta">${escapeHtml(e.sector)} · ${escapeHtml(e.ciudad)} · RUC ${e.ruc||'—'}</div>
        </div>
        <button class="drawer-close" id="drawer-close-btn">✕</button>
      </div>
      <div style="margin-top:10px; display:flex; gap:8px; align-items:center;">

        ${e.estadoCliente==='cliente'?'<span class="pill pill-cliente">Cliente activo</span>':''}
        <button class="btn btn-sm btn-brass no-print" id="edit-empresa-btn" style="margin-left:auto;">Editar ficha</button>
      </div>
      <div class="drawer-tabs">
        ${tabs.map(([k,l])=>`<button class="dtab ${DRAWER_TAB===k?'active':''}" data-tab="${k}">${l}</button>`).join('')}
      </div>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  `;
  document.getElementById('drawer-close-btn').onclick = closeDrawer;

}

    <button class="btn btn-sm btn-primary no-print" id="add-equipo-btn" style="margin-bottom:12px;">+ Nuevo equipo</button>

      <div class="mini-list-item">
        <div>
          <div class="name">${escapeHtml(eq.tipo)} — ${escapeHtml(eq.marca||'s/marca')}</div>
          <div class="sub">Cap. ${escapeHtml(eq.capacidad||'—')} · Cant. ${eq.cantidad||1} · ${escapeHtml(eq.ubicacion||'')}${eq.proximoMantenimiento? ' · Próx. mant. '+fmtDate(eq.proximoMantenimiento):''}</div>

      </div>

  `;
  if(tab==='pipeline'){
    const ops = oportunidadesDe(e.id);
    return `
    <button class="btn btn-sm btn-primary no-print" id="add-op-btn" style="margin-bottom:12px;">+ Nueva oportunidad</button>
    ${ops.length? ops.map(o=>`
      <div class="card" style="margin-bottom:10px;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div>
            <div style="font-weight:700; font-size:13.5px;">${escapeHtml(o.servicio)}</div>
            <div class="sub" style="font-size:11.5px; color:var(--muted); margin-top:2px;">Creada ${fmtDate(o.creadoEn)} ${o.valor?' · '+fmtUSD(o.valor):''}</div>

        <div class="field-row" style="margin-top:10px;">
          <div class="field" style="margin-bottom:0;"><label>Próxima acción</label><input type="text" data-op-accion="${o.id}" value="${escapeHtml(o.proximaAccion||'')}"></div>
          <div class="field" style="margin-bottom:0;"><label>Fecha</label><input type="date" data-op-fecha="${o.id}" value="${o.proximaFecha||''}"></div>
        </div>
        <div style="display:flex; gap:8px; margin-top:10px;">
          <button class="btn btn-sm" data-log-op="${o.id}" data-tipo="llamada">📞 Registrar llamada</button>

    `;
  }
  if(tab==='historial'){
    const log = logDe(e.id);
    return `<div class="timeline">
      ${log.length? log.map(l=>{
        const t = TIPOS_ACTIVIDAD.find(x=>x.k===l.tipo);
        return `<div class="tl-item"><div class="tl-date">${fmtDateFull(l.fecha)} <span class="tag ${t?t.tag:'tag-seguimiento'}">${t?t.label:l.tipo}</span></div><div class="tl-text">${escapeHtml(l.detalle)}</div></div>`;

function bindDrawerBody(e){
  const addContacto = document.getElementById('add-contacto-btn');
  if(addContacto) addContacto.onclick = () => openContactoModal(e.id);
  document.querySelectorAll('[data-del-contacto]').forEach(b=> b.onclick = () => {
    e.contactos = e.contactos.filter(c=>c.id!==b.dataset.delContacto); scheduleSave(); renderDrawer();
  });
  const addEquipo = document.getElementById('add-equipo-btn');
  if(addEquipo) addEquipo.onclick = () => openEquipoModal(e.id);
  document.querySelectorAll('[data-del-equipo]').forEach(b=> b.onclick = () => {
    e.equipos = e.equipos.filter(eq=>eq.id!==b.dataset.delEquipo); scheduleSave(); renderDrawer();
  });
  const addOp = document.getElementById('add-op-btn');
  if(addOp) addOp.onclick = () => openOportunidadModal(e.id);
  document.querySelectorAll('[data-op-estado]').forEach(sel=> sel.onchange = () => {
    const op = oportunidadById(sel.dataset.opEstado);
    const nuevo = Number(sel.value);
    if(nuevo===11){ openPerdidaModal(op.id); return; }
    if(nuevo===10){ op.fechaCierre = todayISO(); e.estadoCliente='cliente'; }
    op.estado = nuevo;
    if(!op.proximaAccion || op.proximaAccion===sugerirProximaAccion(op.estado)){}
    logActivity(e.id, op.id, 'seguimiento', `Estado actualizado a "${estadoById(nuevo).label}"`, todayISO());
    scheduleSave(); renderDrawer(); render();
  });
  document.querySelectorAll('[data-op-valor]').forEach(inp=> inp.onchange = () => {
    const op = oportunidadById(inp.dataset.opValor); op.valor = Number(inp.value)||0; scheduleSave();
  });
  document.querySelectorAll('[data-op-accion]').forEach(inp=> inp.onchange = () => {
    const op = oportunidadById(inp.dataset.opAccion); op.proximaAccion = inp.value; scheduleSave();
  });
  document.querySelectorAll('[data-op-fecha]').forEach(inp=> inp.onchange = () => {
    const op = oportunidadById(inp.dataset.opFecha); op.proximaFecha = inp.value; scheduleSave();
  });
  document.querySelectorAll('[data-log-op]').forEach(btn=> btn.onclick = () => {
    const op = oportunidadById(btn.dataset.logOp);
    logActivity(e.id, op.id, btn.dataset.tipo, `${btn.dataset.tipo==='llamada'?'Llamada':'WhatsApp'} registrado`, todayISO());
    render(); renderDrawer();
  });
  document.querySelectorAll('[data-cotizar-op]').forEach(btn=> btn.onclick = () => {
    openCotizacionModal(e.id, btn.dataset.cotizarOp);
  });
}

      <div class="field"><label>Estado inicial</label><select id="f-oestado">${ESTADOS.filter(s=>s.id<=5||s.id===12).map(s=>`<option value="${s.id}">${s.label}</option>`).join('')}</select></div>
      <div class="field"><label>Valor estimado (USD)</label><input type="number" id="f-oval" value="0"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Próxima acción</label><input id="f-oaccion" value="Llamada de primer contacto"></div>
      <div class="field"><label>Fecha</label><input type="date" id="f-ofecha" value="${todayISO()}"></div>
    </div>
  `, () => {
    const servicio = document.getElementById('f-oserv').value.trim();

    const op = {id:uid(), empresaId:e.id, servicio, estado:Number(document.getElementById('f-oestado').value),

      proximaFecha:document.getElementById('f-ofecha').value, creadoEn:todayISO(), motivoPerdida:null};
    DATA.oportunidades.push(op);
    logActivity(e.id, op.id, 'seguimiento', `Oportunidad creada: ${servicio}`, todayISO());
    scheduleSave(); closeModal(); renderDrawer(); render();
  });
}

/* ---- Motivo de pérdida ---- */
function openPerdidaModal(opId){
  const op = oportunidadById(opId);
  const e = empresaById(op.empresaId);
  openModal('Motivo de pérdida', `
    <div class="field"><label>¿Por qué se perdió esta oportunidad? *</label>
      <select id="f-motivo">${MOTIVOS_PERDIDA.map(m=>`<option>${m}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Notas</label><textarea id="f-motivo-notas"></textarea></div>
  `, () => {
    op.estado = 11; op.motivoPerdida = document.getElementById('f-motivo').value; op.fechaCierre = todayISO();
    logActivity(e.id, op.id, 'seguimiento', `Oportunidad perdida — ${op.motivoPerdida}. ${document.getElementById('f-motivo-notas').value}`, todayISO());
    scheduleSave(); closeModal(); renderDrawer(); render();
  }, 'Confirmar pérdida');
}

/* ---- Cotización ---- */
function openCotizacionModal(empresaId, oportunidadId){
  const e = empresaById(empresaId);
  const op = oportunidadId ? oportunidadById(oportunidadId) : null;
  const contacto = e.contactos.find(c=>c.principal) || e.contactos[0];
  openModal('Generar cotización', `
    <div class="field"><label>Servicio / descripción</label><input id="f-qserv" value="${op?escapeHtml(op.servicio):''}"></div>
    <div class="field"><label>Ítem 1</label><input id="f-qitem1" placeholder="Descripción del ítem"></div>
    <div class="field-row">
      <div class="field"><label>Cantidad</label><input type="number" id="f-qcant1" value="1"></div>
      <div class="field"><label>Precio unitario (USD)</label><input type="number" id="f-qprecio1" value="${op&&op.valor?op.valor:0}"></div>
    </div>
    <div class="field"><label>Contacto destinatario</label>
      <select id="f-qcontacto">${e.contactos.map(c=>`<option value="${c.id}" ${contacto&&contacto.id===c.id?'selected':''}>${escapeHtml(c.nombre+' '+c.apellido)}</option>`).join('') || '<option value="">Sin contactos registrados</option>'}</select>
    </div>
  `, () => {
    const servicio = document.getElementById('f-qserv').value.trim() || (op?op.servicio:'Servicio BAS Electric');
    const item1desc = document.getElementById('f-qitem1').value.trim() || servicio;
    const cant = Number(document.getElementById('f-qcant1').value)||1;
    const precio = Number(document.getElementById('f-qprecio1').value)||0;
    const numero = 'BAS-2026-' + (DATA.correlativoCotizacion++);
    const cot = {id:uid(), numero, empresaId:e.id, oportunidadId: op?op.id:null, contactoId:document.getElementById('f-qcontacto').value,
      servicio, items:[{desc:item1desc, cant, precio}], fecha:todayISO(), fechaEnvio:todayISO(), estado:'Enviada',
      proximoSeguimiento: shiftISO(todayISO(),5), observaciones:''};
    DATA.cotizaciones.push(cot);
    if(op){ op.estado = 8; op.valor = cant*precio; op.proximaAccion='Llamar para dar seguimiento a la cotización'; op.proximaFecha=shiftISO(todayISO(),5); }
    logActivity(e.id, op?op.id:null, 'cotizacion', `Cotización ${numero} generada — ${fmtUSD(cant*precio)}`, todayISO());
    scheduleSave(); closeModal(); renderDrawer(); render();
    openQuoteView(cot.id);
  }, 'Generar');
}

    scheduleSave(); render();
  };
}

/* ============================================================
   IMPORTAR CSV
   ============================================================ */
function parseCSV(text){
  // Parser CSV simple con soporte de comillas y comas dentro de campos
  const rows = [];
  let row = [], field = '', inQuotes = false;
  text = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; } }
      else field += c;
    } else {
      if(c==='"') inQuotes = true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.some(v=>v && v.trim())).map(r=>{
    const obj = {};
    headers.forEach((h,idx)=> obj[h] = (r[idx]||'').trim());
    return obj;
  });
}
function pick(obj, keys){
  for(const k of keys){ if(obj[k] !== undefined && obj[k] !== '') return obj[k]; }
  return '';
}
function mapClasificacion(v){
  v = (v||'').trim().toUpperCase();
  if(v==='A+' || v==='A') return 'A';
  if(v==='B') return 'B';
  if(v==='C') return 'C';
  return 'C';
}
function openImportModal(){
  openModal('Importar CSV de empresas', `
    <div class="field">
      <label>Selecciona el archivo CSV</label>
      <input type="file" id="f-csv-file" accept=".csv,text/csv">
    </div>
    <div style="font-size:12px; color:var(--muted); line-height:1.5;">
      Reconoce columnas como: <b>Empresa</b>, <b>Sector</b>, <b>Ciudad/Zona</b>, <b>Prioridad</b> (A+/A/B/C),
      <b>Servicio BAS recomendado</b>, <b>Contacto objetivo</b>, <b>Nombre contacto</b>, <b>Cargo</b>, <b>Teléfono</b>,
      <b>WhatsApp</b>, <b>Email</b>, <b>RUC</b>, <b>Dirección</b>, <b>Fuente/nota</b>.<br>
      Las empresas cuyo nombre ya exista en el CRM se omiten automáticamente.
    </div>
    <div id="import-summary" style="margin-top:12px; font-size:13px;"></div>
  `, () => {
    const file = document.getElementById('f-csv-file').files[0];
    if(!file){ alert('Selecciona un archivo CSV.'); return; }
    const reader = new FileReader();
    reader.onload = (ev) => {
      const rows = parseCSV(ev.target.result);
      const existingNames = new Set(DATA.empresas.map(e=>e.nombre.trim().toLowerCase()));
      let imported = 0, omitted = 0;
      rows.forEach(r=>{
        const nombre = pick(r,['Empresa','Nombre','Nombre comercial']).trim();
        if(!nombre){ return; }
        if(existingNames.has(nombre.toLowerCase())){ omitted++; return; }
        const nombreContacto = pick(r,['Nombre contacto']);
        const contactos = [];
        if(nombreContacto){
          contactos.push({id:uid(), nombre:nombreContacto, apellido:'', cargo:pick(r,['Cargo']),
            area:'', telefono:pick(r,['Teléfono','Telefono']), whatsapp:pick(r,['WhatsApp']),
            correo:pick(r,['Email','Correo']), principal:true, observaciones:'', creadoEn:todayISO()});
        }
        const ne = {
          id:uid(), nombre, razonSocial:nombre, ruc:pick(r,['RUC']),
          ciudad:pick(r,['Ciudad/Zona','Ciudad']), direccion:pick(r,['Dirección','Direccion']),
          sector:pick(r,['Sector']), clasificacion:mapClasificacion(pick(r,['Prioridad','Clasificación','Clasificacion'])),
          estadoCliente:'prospecto', fuente:'Prospección BAS', web:'', maps:'',
          observaciones:pick(r,['Fuente/nota','Observaciones']),
          servicioRecomendado:pick(r,['Servicio BAS recomendado','Servicio recomendado']),
          contactoObjetivo:pick(r,['Contacto objetivo']),
          contactos, equipos:[], creadoEn:todayISO()
        };
        DATA.empresas.push(ne);
        existingNames.add(nombre.toLowerCase());
        imported++;
      });
      scheduleSave();
      document.getElementById('import-summary').innerHTML =
        `<b style="color:var(--green);">${imported} empresas importadas.</b>${omitted? ' '+omitted+' omitidas por estar duplicadas.':''}`;
      if(imported){ VIEW='empresas'; render(); }
    };
    reader.readAsText(file, 'UTF-8');
  }, 'Importar');
}
